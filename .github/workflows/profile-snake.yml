name: Actualizar Snake (diseño anterior)

on:
  workflow_dispatch:

concurrency:
  group: profile-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el perfil
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generar animaciones clara y oscura
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%230F766E&color_dots=%23EBEDF0,%23CCFBF1,%2399F6E4,%232DD4BF,%230D9488
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%235EEAD4&color_dots=%2311262E,%23134242,%231B6B63,%2323A594,%235EEAD4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar las animaciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Las animaciones ya están actualizadas.'
            exit 0
          fi
          git commit -m 'Actualizar animación de contribuciones'
          git pull --rebase origin main
          git push origin HEAD:main
